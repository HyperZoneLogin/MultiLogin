plugins {
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}

repositories {
    maven {
        name 'papermc'
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

dependencies {
    implementation project(":api")
    implementation project(":flows")
    implementation project(":loader")

    compileOnly fileTree(dir: 'libraries', include: ['*.jar'])
    compileOnly 'io.netty:netty-all:4.1.86.Final'
    compileOnly 'net.minecrell:terminalconsoleappender:1.3.0'
//    compileOnly 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'

    // https://mvnrepository.com/artifact/net.kyori/adventure-text-serializer-gson
    compileOnly 'net.kyori:adventure-text-serializer-gson:4.19.0'
    //    com.google.inject
    compileOnly 'com.google.inject:guice:4.2.3'
    // https://mvnrepository.com/artifact/com.google.guava/guava
    compileOnly 'com.google.guava:guava:33.4.0-jre'
}


shadowJar {
    archiveBaseName.set('MultiLogin-OpenVelocity')

    if (System.getProperty("env", "AUTO") == "final") {
        archiveVersion.set(project.plugin_version as String)
    } else {
        String ver = "Build_" + version
        archiveVersion.set(ver)
    }
    archiveClassifier.set("")
    from {
        project(':core').tasks.shadowJar.archiveFile
    }
}


artifacts {
    archives shadowJar
}